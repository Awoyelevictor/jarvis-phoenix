<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <meta name="description" content="ULTRON — voice-controlled personal AI.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>ULTRON — Voice Interface</title>
</head>
<body>
  <main class="voice-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><span><strong>ULTRON</strong><small>PERSONAL INTELLIGENCE</small></span></div>
      <div class="system-state"><span class="state-light" id="state-light"></span><span id="state-label">STANDBY</span></div>
    </header>

    <section class="reactor-stage" aria-label="ULTRON voice core">
      <div class="reactor" id="reactor">
        <div class="reactor-halo halo-a"></div>
        <div class="reactor-halo halo-b"></div>
        <div class="reactor-ring ring-a"></div>
        <div class="reactor-ring ring-b"></div>
        <div class="reactor-ring ring-c"></div>
        <div class="reactor-core"><div class="core-slit"></div><div class="core-point"></div></div>
        <div class="reactor-shadow"></div>
      </div>
      <div class="voice-state" id="voice-state">SYSTEM STANDBY</div>
      <p class="voice-hint" id="voice-hint">Tap the core to begin a voice session</p>
    </section>

    <section class="controls">
      <button class="mic-button" id="mic-button" type="button" aria-label="Start voice conversation">
        <span class="mic-symbol">🎙</span>
        <span class="mic-ripple"></span>
      </button>
      <div class="control-caption" id="control-caption">ACTIVATE VOICE</div>
      <button class="stop-button" id="stop-button" type="button" hidden>END SESSION</button>
    </section>

    <footer class="footer">
      <span>GEMINI INTELLIGENCE</span><span class="footer-separator">◆</span><span id="voice-engine">GEMINI TTS · CHARON</span>
    </footer>
  </main>
  <audio id="ultron-audio" playsinline></audio>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
