name: ULTRON foundation tests

on:
  push:
    branches: [ultron-multidevice-foundation]
  pull_request:
    branches: [ultron-multidevice-foundation]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile application and tests
        run: python -m compileall -q app phoenix.py tests
      - name: Run test suite
        run: python -m pytest -v
