name: ULTRON voice integration tests

on:
  pull_request:
    branches: [phoenix-upgrade]
  push:
    branches: [ultron-openrouter-elevenlabs]

jobs:
  voice-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Compile Python application
        run: python -m compileall -q app
      - name: Test OpenRouter and ElevenLabs voice pipeline
        run: python -m pytest -q tests/test_speech.py
